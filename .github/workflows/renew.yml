name: Auto Renew Bot-hosting

on:
  #schedule:
  #  - cron: '30 22 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-24.04

    env:
      # 可选: 外部住宅代理(b2proxy 等), 格式 user:pass@host:port 或 http://user:pass@host:port
      # 配置后优先使用它, 不再启动 sing-box; 粘性会话建议 >= 30 分钟
      RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🌐 启用外部住宅代理 (可选)
        if: env.RESIDENTIAL_PROXY != ''
        run: |
          echo "IS_PROXY=true" >> "$GITHUB_ENV"
          echo "PROXY_SERVER=$RESIDENTIAL_PROXY" >> "$GITHUB_ENV"
          echo "✅ 已启用外部住宅代理(优先于 sing-box)"

      - name: ⚙ 设置代理 (sing-box)
        if: env.RESIDENTIAL_PROXY == ''
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          #TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          #TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MP_URL: ${{ secrets.MP_URL }}
          MP_APIKEY: ${{ secrets.MP_APIKEY }}
          MP_CHANNEL: ${{ secrets.MP_CHANNEL }}
          MP_MTYPE: ${{ secrets.MP_MTYPE }}
        run: |
          set -o pipefail
          xvfb-run --auto-servernum python3 app.py 2>&1 | tee renew_run.log

      - name: 📤 上传续期诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-debug
          path: |
            renew_run.log
            renew_debug_*
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
